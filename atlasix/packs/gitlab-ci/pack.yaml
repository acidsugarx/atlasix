version: 1
# Built-in atlasix pack: GitLab CI monorepo (jobs, extends/includes, needs, env vars, nushell modules).
# Import: atlasix pack import gitlab-ci
entity_types:
  job:
    files: ["**/*.yml", "**/*.yaml"]
    extractor: yaml_jobs
    fields: [stage, image, tags, script, variables, needs, rules, when]
  env_var:
    files: ["lib/**/README.md"]
    extractor: regex
    pattern: '\$\{(\w+)\}'
  nu_module:
    files: ["**/*.nu"]
    extractor: line_symbols
    pattern: '^\s*export def\s+"?(?P<name>[\w][\w -]*)"?\s*[\[(]'
  nu_use:
    files: ["**/*.nu"]
    extractor: line_symbols
    pattern: '^\s*use\s+(?P<name>\S+)'
references:
  nu_uses:
    from: {entity: nu_use, field: name}
    resolve: relative_path     # nushell: `use ../logger/` → ../logger/mod.nu relative to source file
  extends:
    from: {entity: job, field: extends}
    resolve: include_aware     # GitLab semantics: the target included into THIS pipeline
  merges:
    from: {entity: job, field: merges}
    resolve: same_doc_anchor   # YAML merge keys (<<: *anchor) → anchored job in same file
  needs:
    from: {entity: job, field: needs, pattern: '"([\w./:-]+)"'}
    resolve: include_aware
  includes:
    from: {entity: file, field: raw_regex, pattern: "[\"'](/?[A-Za-z0-9_./-]+\\.ya?ml)[\"']"}
    resolve: repo_path
  includes_ref:
    from: {entity: file, field: raw_regex, pattern: '(\S+\.ya?ml)@(\S+)'}
    resolve: repo_path
  rules_changes:
    from: {entity: job, field: rules, pattern: '[A-Za-z0-9_][\w./-]*/[\w.*-]*'}
    resolve: none             # raw path/glob facts kept for who-uses
  uses_var:
    from: {entity: job, field: script, pattern: '\$\{?([A-Z][A-Z0-9_]+)\}?'}
    resolve: entity_name
    to: env_var
text_units:
  unit: {entity: job, field: script}
duplicates:
  min_lines: 5
  threshold: 0.85
