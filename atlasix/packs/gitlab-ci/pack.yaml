version: 1
# Built-in atlasix pack: GitLab CI monorepo (jobs, extends/includes, env vars, nushell modules).
# Import: atlasix pack import gitlab-ci
entity_types:
  job:
    files: ["**/*.yml", "**/*.yaml"]
    extractor: yaml_jobs
    fields: [stage, image, tags, script]
  env_var:
    files: ["lib/**/README.md"]
    extractor: regex
    pattern: '\$\{(\w+)\}'
  nu_module:
    files: ["**/*.nu"]
    extractor: line_symbols
    pattern: '^\s*export def\s+(?P<name>[\w-]+)'
references:
  extends:
    from: {entity: job, field: extends}
    resolve: same_doc_dict
  includes:
    from: {entity: file, field: raw_regex, pattern: '(\S+\.ya?ml)@(\S+)'}
    resolve: repo_path
  include_local:
    from: {entity: file, field: raw_regex, pattern: 'local:\s*(\S+\.ya?ml)'}
    resolve: repo_path
  uses_var:
    from: {entity: job, field: script, pattern: '\$\{?([A-Z][A-Z0-9_]+)\}?'}
    resolve: entity_name
    to: env_var
text_units:
  unit: {entity: job, field: script}
duplicates:
  min_lines: 5
  threshold: 0.85
