[project]
name = "atlasix"
version = "0.1.0"
description = "Agent-agnostic structural repo indexer for LLM agents: navigation, who-uses, duplicates, lint, semantic search, graph"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "ruamel.yaml>=0.18",
    "rank_bm25>=0.2.2",
    "numpy>=1.26",
    "fastembed>=0.3.6",
    "sqlite-vec>=0.1.3",
    "mcp>=1.2",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
atlasix = "atlasix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["atlasix"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "atlasix/SKILL.md"
"packs-authoring.md" = "atlasix/packs-authoring.md"
"opencode/atlasix.js" = "atlasix/opencode/atlasix.js"
"oh-my-pi/atlasix.ts" = "atlasix/oh-my-pi/atlasix.ts"
"claude-code/commands/atlasix.md" = "atlasix/claude-code/atlasix.md"
"claude-code/commands/atlasix-lint.md" = "atlasix/claude-code/atlasix-lint.md"
