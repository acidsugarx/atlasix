[project]
name = "atlasix"
version = "0.1.0"
description = "Agent-agnostic structural repo indexer for LLM agents: navigation, who-uses, duplicates, lint, semantic search, graph"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "ruamel.yaml>=0.18",
    "rank_bm25>=0.2.2",
    "numpy>=1.26",
    "fastembed>=0.3.6",
    "sqlite-vec>=0.1.3",
]

[project.scripts]
atlasix = "atlasix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["atlasix"]
